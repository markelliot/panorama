name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: Check formatting
        run: yarn prettier --check 'src/**/*.{js,jsx,css,json,md,scss,ts,tsx}'

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint
